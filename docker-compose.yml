services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: Skillex2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Skillex2"]
      interval: 10s
      timeout: 5s
      retries: 5

  eurekaserver:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    image: eureka-server:1.0
    container_name: eurekaserver
    ports:
      - "9000:9000"
    environment:
      EUREKA_CLIENT_REGISTER-WITH-EUREKA: "false"
      EUREKA_CLIENT_FETCH-REGISTRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/actuator/health || curl -f http://localhost:9000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: api-gateway:1.0
    container_name: gateway
    ports:
      - "8000:8000"
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/

  cartservice:
    build:
      context: ./cartservice
      dockerfile: Dockerfile
    image: cart-service:1.0
    container_name: cartservice
    ports:
      - "8002:8002"
    depends_on:
      eurekaserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Skillex2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"

  productservice:
    build:
      context: ./productservice
      dockerfile: Dockerfile
    image: product-service:1.0
    container_name: productservice
    ports:
      - "8001:8001"
    depends_on:
      eurekaserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Skillex2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"

volumes:
  postgres_data:
